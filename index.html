<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Voucer - Turja Computer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Animasi sederhana */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">

    <!-- Container Utama -->
    <div id="app"></div>

    <script>
        // ==========================================
        // MANAJEMEN STATE & DATA (Menggunakan LocalStorage)
        // ==========================================
        const defaultUsers = [
            { id: '1', username: 'admin', password: 'password123', role: 'admin', name: 'Administrator Utama' }
        ];

        let users = JSON.parse(localStorage.getItem('tc_users')) || defaultUsers;
        let vouchers = JSON.parse(localStorage.getItem('tc_vouchers')) || [];
        let sales = JSON.parse(localStorage.getItem('tc_sales')) || [];
        let currentUser = JSON.parse(localStorage.getItem('tc_currentUser')) || null;
        
        // State UI
        let activeAdminTab = 'verify';
        let activeMarketingTab = 'create_voucher';
        let generatedVoucher = null;
        let searchResult = null;
        let loginError = '';
        let editingUserId = null; // Menyimpan ID user yang sedang diedit
        let editingSaleId = null; // Menyimpan ID penjualan yang sedang diedit

        function saveData() {
            localStorage.setItem('tc_users', JSON.stringify(users));
            localStorage.setItem('tc_vouchers', JSON.stringify(vouchers));
            localStorage.setItem('tc_sales', JSON.stringify(sales));
            localStorage.setItem('tc_currentUser', JSON.stringify(currentUser));
        }

        function reRender() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderDashboard();
            }
            // Render ulang icon Lucide setelah DOM berubah
            lucide.createIcons();
            
            // Pasang Event Listeners setelah HTML dirender
            attachEventListeners();
        }

        // ==========================================
        // FUNGSI AKSI (LOGIC)
        // ==========================================
        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            
            const user = users.find(u => u.username === usernameInput && u.password === passwordInput);
            if (user) {
                currentUser = user;
                loginError = '';
                saveData();
                reRender();
            } else {
                loginError = 'Username atau password salah.';
                reRender();
            }
        }

        // Logout
        function handleLogout() {
            currentUser = null;
            generatedVoucher = null;
            searchResult = null;
            saveData();
            reRender();
        }

        // Mengacak Kode Voucer
        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'VCH-';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Pembuatan Voucher Baru
        function handleCreateVoucher(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            if (!name.trim()) return;

            const now = new Date();
            const expiryDate = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000); // +7 Hari

            const newVoucher = {
                id: Date.now().toString(),
                code: generateRandomCode(),
                customerName: name,
                customerPhone: phone,
                customerAddress: address,
                status: 'active',
                createdBy: currentUser.name,
                createdAt: now.toISOString(),
                expiresAt: expiryDate.toISOString(),
                usedAt: null
            };

            vouchers.unshift(newVoucher); // Tambah di awal array
            generatedVoucher = newVoucher;
            saveData();
            reRender();
        }

        // Cek Keberadaan & Status Voucher
        function handleSearchVoucher(e) {
            e.preventDefault();
            const code = document.getElementById('search-code').value.toUpperCase().trim();
            if (!code) return;

            const voucher = vouchers.find(v => v.code === code);
            
            if (!voucher) {
                searchResult = { status: 'not_found', voucher: null };
            } else {
                const isExpired = new Date(voucher.expiresAt) < new Date();
                if (voucher.status === 'used') {
                    searchResult = { status: 'used', voucher: voucher };
                } else if (isExpired) {
                    searchResult = { status: 'expired', voucher: voucher };
                } else {
                    searchResult = { status: 'found', voucher: voucher };
                }
            }
            reRender();
        }

        // Menggunakan Voucher (Redeem)
        function handleRedeemVoucher() {
            if (searchResult?.status !== 'found') return;

            const confirmRedeem = window.confirm(`Verifikasi bahwa pelanggan adalah ${searchResult.voucher.customerName}?`);
            if (!confirmRedeem) return;

            const voucherIndex = vouchers.findIndex(v => v.id === searchResult.voucher.id);
            if(voucherIndex > -1) {
                vouchers[voucherIndex].status = 'used';
                vouchers[voucherIndex].usedAt = new Date().toISOString();
                
                searchResult = { 
                    status: 'used', 
                    voucher: vouchers[voucherIndex] 
                };
                saveData();
                reRender();
            }
        }

        // Registrasi Akun Marketing Baru oleh Admin
        function handleCreateUser(e) {
            e.preventDefault();
            const newName = document.getElementById('new-name').value;
            const newUsername = document.getElementById('new-username').value;
            const newPassword = document.getElementById('new-password').value;

            if (users.find(u => u.username === newUsername)) {
                alert("Username sudah digunakan. Pilih username lain.");
                return;
            }
            
            const newUser = {
                id: Date.now().toString(),
                username: newUsername,
                password: newPassword,
                role: 'marketing',
                name: newName
            };
            
            users.push(newUser);
            saveData();
            alert(`Akun marketing "${newName}" berhasil dibuat!`);
            activeAdminTab = 'users'; // Ganti ke tab daftar akun setelah sukses membuat
            reRender();
        }

        // Edit Akun Marketing oleh Admin
        function handleEditUserSubmit(e) {
            e.preventDefault();
            const updatedName = document.getElementById('new-name').value;
            const updatedUsername = document.getElementById('new-username').value;
            const updatedPassword = document.getElementById('new-password').value;

            // Pastikan username tidak bentrok dengan user lain
            if (users.find(u => u.username === updatedUsername && u.id !== editingUserId)) {
                alert("Username sudah digunakan oleh akun lain. Pilih username lain.");
                return;
            }

            const userIndex = users.findIndex(u => u.id === editingUserId);
            if (userIndex > -1) {
                users[userIndex].name = updatedName;
                users[userIndex].username = updatedUsername;
                users[userIndex].password = updatedPassword;
                saveData();
                alert(`Akun marketing "${updatedName}" berhasil diperbarui!`);
            }

            editingUserId = null;
            activeAdminTab = 'users'; // Kembalikan ke tab daftar setelah sukses edit
            reRender();
        }

        window.startEditUser = function(id) {
            editingUserId = id;
            activeAdminTab = 'create_user'; // Pindah ke tab form edit
            reRender();
        }

        window.cancelEditUser = function() {
            editingUserId = null;
            activeAdminTab = 'users'; // Kembalikan ke tab daftar jika batal
            reRender();
        }

        // ==========================================
        // FUNGSI PENJUALAN (MARKETING & ADMIN)
        // ==========================================
        window.switchMarketingTab = function(tab) {
            activeMarketingTab = tab;
            editingSaleId = null; // Batalkan edit jika berpindah tab secara bebas
            reRender();
        }

        function handleCreateSale(e) {
            e.preventDefault();
            const newSale = {
                id: Date.now().toString(),
                pembeli: document.getElementById('sale-pembeli').value,
                hp: document.getElementById('sale-hp').value,
                alamat: document.getElementById('sale-alamat').value,
                produk: document.getElementById('sale-produk').value,
                kodeVoucher: document.getElementById('sale-voucher').value,
                harga: document.getElementById('sale-harga').value,
                createdBy: currentUser.name,
                createdAt: new Date().toISOString()
            };
            sales.unshift(newSale); // Tambah di atas
            saveData();
            alert('Data penjualan berhasil dicatat!');
            
            // Otomatis alihkan ke halaman tabel riwayat penjualan setelah mencatat
            if (currentUser.role === 'marketing') {
                activeMarketingTab = 'sales_history';
            } else {
                activeAdminTab = 'sales_history';
            }
            reRender();
        }

        function handleEditSaleSubmit(e) {
            e.preventDefault();
            const index = sales.findIndex(s => s.id === editingSaleId);
            if (index > -1) {
                sales[index].pembeli = document.getElementById('sale-pembeli').value;
                sales[index].hp = document.getElementById('sale-hp').value;
                sales[index].alamat = document.getElementById('sale-alamat').value;
                sales[index].produk = document.getElementById('sale-produk').value;
                sales[index].kodeVoucher = document.getElementById('sale-voucher').value;
                sales[index].harga = document.getElementById('sale-harga').value;
                saveData();
                alert('Data penjualan berhasil diperbarui!');
            }
            editingSaleId = null;
            
            // Otomatis alihkan ke halaman tabel riwayat penjualan setelah mengedit
            if (currentUser.role === 'marketing') {
                activeMarketingTab = 'sales_history';
            } else {
                activeAdminTab = 'sales_history';
            }
            reRender();
        }

        window.startEditSale = function(id) {
            editingSaleId = id;
            
            // Alihkan tab ke form pencatatan (yang otomatis mendeteksi mode edit)
            if (currentUser.role === 'marketing') {
                activeMarketingTab = 'create_sale';
            } else {
                activeAdminTab = 'create_sale';
            }
            reRender();
        }

        window.cancelEditSale = function() {
            editingSaleId = null;
            
            // Kembalikan ke tab riwayat data penjualan
            if (currentUser.role === 'marketing') {
                activeMarketingTab = 'sales_history';
            } else {
                activeAdminTab = 'sales_history';
            }
            reRender();
        }

        // ==========================================
        // FUNGSI CANVAS & WHATSAPP
        // ==========================================
        function getVoucherById(id) {
            return vouchers.find(v => v.id === id);
        }

        function generateVoucherCanvas(voucher) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');

            // Background Utama
            const gradient = ctx.createLinearGradient(0, 0, 800, 400);
            gradient.addColorStop(0, '#4f46e5'); // Indigo 600
            gradient.addColorStop(1, '#7e22ce'); // Purple 700
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 800, 400);

            // Garis Putus-putus
            ctx.beginPath();
            ctx.setLineDash([10, 15]);
            ctx.moveTo(600, 0);
            ctx.lineTo(600, 400);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Lingkaran potongan
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(600, 0, 20, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(600, 400, 20, 0, Math.PI * 2); ctx.fill();

            // Teks Toko
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px sans-serif';
            ctx.fillText('TURJA COMPUTER', 50, 70);

            // Nilai Voucer
            ctx.font = 'bold 72px sans-serif';
            ctx.fillStyle = '#fde047';
            ctx.fillText('100 Rb', 50, 150);

            // Box Kode
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            if(ctx.roundRect) {
                ctx.beginPath(); ctx.roundRect(50, 180, 400, 80, 15); ctx.fill();
            } else {
                ctx.fillRect(50, 180, 400, 80); // Fallback browser lama
            }
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px monospace';
            ctx.fillText(voucher.code, 80, 240);

            // Info Pelanggan
            ctx.font = '20px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillText('Kepada', 50, 310);
            ctx.fillText('No. WA', 50, 340);
            ctx.fillText('Alamat', 50, 370);

            ctx.fillText(':', 130, 310);
            ctx.fillText(':', 130, 340);
            ctx.fillText(':', 130, 370);

            ctx.font = 'bold 20px sans-serif';
            ctx.fillStyle = '#ffffff';
            let custName = voucher.customerName.toUpperCase();
            if(custName.length > 25) custName = custName.substring(0, 25) + '...';
            ctx.fillText(custName, 150, 310);
            ctx.fillText(voucher.customerPhone || '-', 150, 340);
            
            let custAddr = voucher.customerAddress || '-';
            if(custAddr.length > 35) custAddr = custAddr.substring(0, 35) + '...';
            ctx.fillText(custAddr, 150, 370);

            // Info Kanan
            ctx.font = 'bold 24px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Berlaku s/d:', 630, 100);
            
            ctx.font = '24px sans-serif';
            ctx.fillStyle = '#fde047';
            const dateStr = new Date(voucher.expiresAt).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'});
            const dateParts = dateStr.split(' ');
            ctx.fillText((dateParts[0] || '') + ' ' + (dateParts[1] || ''), 630, 140);
            ctx.fillText(dateParts[2] || '', 630, 170);

            ctx.font = 'bold 18px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Turja Computer', 630, 260);

            ctx.font = '14px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillText('Tunjukkan voucer', 630, 320);
            ctx.fillText('ke kasir/admin.', 630, 345);

            return canvas;
        }

        window.downloadVoucher = function(id) {
            const voucher = getVoucherById(id);
            if(!voucher) return;
            const canvas = generateVoucherCanvas(voucher);
            const link = document.createElement('a');
            link.download = `Voucer-TurjaComputer-${voucher.customerName.replace(/\s+/g, '-')}-${voucher.code}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.shareWhatsApp = function(id) {
            const voucher = getVoucherById(id);
            if(!voucher) return;
            const expDate = new Date(voucher.expiresAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            const text = `Halo *${voucher.customerName}*! 🎉\n\nIni adalah VOUCER SPESIAL senilai *100 Rb* dari *Turja Computer* untuk Anda.\n\nKode Voucer: *${voucher.code}*\nBerlaku sampai: *${expDate}*\n\nAlamat yang tercatat: ${voucher.customerAddress || '-'}\n\nSilakan tunjukkan pesan ini atau gambar voucer kepada admin di toko kami untuk mendapatkan potongan harga.\n\nTerima kasih!`;
            
            let waUrl = `https://wa.me/`;
            if (voucher.customerPhone) {
                let phone = voucher.customerPhone.replace(/\D/g, ''); 
                if (phone.startsWith('0')) phone = '62' + phone.substring(1); 
                waUrl += `${phone}?text=${encodeURIComponent(text)}`;
            } else {
                waUrl += `?text=${encodeURIComponent(text)}`;
            }
            window.open(waUrl, '_blank');
        }

        window.switchAdminTab = function(tab) {
            activeAdminTab = tab;
            editingSaleId = null; // Batalkan edit jika berpindah tab secara bebas
            reRender();
        }

        // ==========================================
        // FUNGSI RENDER HTML
        // ==========================================
        
        // --- VIEW: LOGIN ---
        function renderLogin() {
            return `
            <div class="min-h-screen flex flex-col items-center justify-center p-4">
                <div class="mb-8 text-center animate-fade-in">
                    <div class="bg-indigo-600 inline-block p-4 rounded-2xl text-white shadow-lg mb-4">
                        <i data-lucide="ticket" class="w-12 h-12"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold text-slate-800">Sistem Manajemen Voucer</h1>
                    <p class="text-slate-500 mt-2">Login untuk mengelola promosi Turja Computer</p>
                </div>

                <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 animate-fade-in">
                    <form id="login-form" class="space-y-5">
                        ${loginError ? `
                        <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm flex items-center gap-2">
                            <i data-lucide="x-circle" class="w-4 h-4"></i> ${loginError}
                        </div>` : ''}
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                            <input type="text" id="username" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Masukkan username" required />
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                            <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••" required />
                        </div>
                        
                        <button type="submit" class="w-full py-3 mt-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-semibold shadow-md transition-all">
                            Masuk ke Sistem
                        </button>
                    </form>

                    <div class="mt-6 pt-6 border-t border-slate-100">
                        <p class="text-xs text-center text-slate-400">
                            <strong>Demo Akun Admin:</strong><br/>
                            User: admin | Pass: password123
                        </p>
                    </div>
                </div>
            </div>`;
        }

        // --- VIEW: NAVBAR & DASHBOARD WRAPPER ---
        function renderDashboard() {
            const isMarketing = currentUser.role === 'marketing';
            return `
            <!-- Navbar -->
            <nav class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-10 shadow-sm">
                <div class="max-w-6xl mx-auto flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-lg ${isMarketing ? 'bg-indigo-100 text-indigo-600' : 'bg-emerald-100 text-emerald-600'}">
                            <i data-lucide="ticket" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-slate-800 leading-tight">PromoVoucer</h1>
                            <span class="text-xs font-medium text-slate-400 capitalize">${currentUser.role} Area</span>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <div class="hidden sm:flex flex-col items-end">
                            <span class="text-sm font-bold text-slate-700">${currentUser.name}</span>
                            <span class="text-xs font-medium text-slate-400 capitalize">${currentUser.role}</span>
                        </div>
                        <button onclick="handleLogout()" class="p-2 text-slate-500 hover:bg-red-50 hover:text-red-600 rounded-lg transition-colors" title="Keluar">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="max-w-6xl mx-auto p-6">
                ${isMarketing ? renderMarketingDashboard() : renderAdminDashboard()}
            </main>`;
        }

        // --- VIEW: MARKETING DASHBOARD ---
        function renderMarketingDashboard() {
            let contentHTML = '';
            
            if (activeMarketingTab === 'create_voucher') {
                contentHTML = renderMarketingCreateVoucher();
            } else if (activeMarketingTab === 'vouchers') {
                contentHTML = renderMarketingVouchers();
            } else if (activeMarketingTab === 'create_sale') {
                contentHTML = renderMarketingCreateSale();
            } else if (activeMarketingTab === 'sales_history') {
                contentHTML = renderMarketingSalesHistory();
            }
            
            return `
            <div class="space-y-6">
                <div class="flex gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 w-fit mx-auto flex-wrap justify-center">
                    <button onclick="switchMarketingTab('create_voucher')" class="flex items-center gap-2 px-5 py-2 rounded-xl font-semibold transition-all ${activeMarketingTab === 'create_voucher' ? 'bg-indigo-100 text-indigo-700' : 'text-slate-500 hover:bg-slate-50'}">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Buat Voucer Baru
                    </button>
                    <button onclick="switchMarketingTab('vouchers')" class="flex items-center gap-2 px-5 py-2 rounded-xl font-semibold transition-all ${activeMarketingTab === 'vouchers' ? 'bg-blue-100 text-blue-700' : 'text-slate-500 hover:bg-slate-50'}">
                        <i data-lucide="ticket" class="w-4 h-4"></i> Daftar Voucer
                    </button>
                    <button onclick="switchMarketingTab('create_sale')" class="flex items-center gap-2 px-5 py-2 rounded-xl font-semibold transition-all ${activeMarketingTab === 'create_sale' ? 'bg-fuchsia-100 text-fuchsia-700' : 'text-slate-500 hover:bg-slate-50'}">
                        <i data-lucide="shopping-bag" class="w-4 h-4"></i> Catat Penjualan
                    </button>
                    <button onclick="switchMarketingTab('sales_history')" class="flex items-center gap-2 px-5 py-2 rounded-xl font-semibold transition-all ${activeMarketingTab === 'sales_history' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-500 hover:bg-slate-50'}">
                        <i data-lucide="database" class="w-4 h-4"></i> Data Penjualan
                    </button>
                </div>
                ${contentHTML}
            </div>`;
        }

        // --- SUB-VIEW: TIM MARKETING - CREATE VOUCHER (FORM & PREVIEW ONLY) ---
        function renderMarketingCreateVoucher() {
            let generatedHTML = '';
            if (generatedVoucher) {
                generatedHTML = `
                <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-6 rounded-2xl shadow-lg text-white animate-fade-in border border-indigo-500">
                    <h3 class="font-semibold text-indigo-100 mb-4 flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-5 h-5"></i> Voucer Berhasil Dibuat!
                    </h3>
                    <div class="bg-white/10 p-4 rounded-xl backdrop-blur-sm border border-white/20 text-center mb-4">
                        <p class="text-3xl font-mono font-bold tracking-widest">${generatedVoucher.code}</p>
                    </div>
                    <div class="text-sm text-indigo-100 space-y-2 mb-6">
                        <p>Nilai Voucer: <span class="font-bold text-yellow-300">100 Rb</span></p>
                        <p>Pelanggan: <span class="font-semibold text-white">${generatedVoucher.customerName}</span></p>
                        <p>WA: <span class="font-semibold text-white">${generatedVoucher.customerPhone}</span></p>
                        <p>Berlaku s/d: <span class="font-semibold text-yellow-300">
                            ${new Date(generatedVoucher.expiresAt).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}
                        </span></p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="shareWhatsApp('${generatedVoucher.id}')" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl font-medium text-sm transition-colors bg-emerald-500 hover:bg-emerald-600 text-white font-bold">
                            <i data-lucide="message-circle" class="w-4 h-4"></i> Kirim WA
                        </button>
                        <button onclick="downloadVoucher('${generatedVoucher.id}')" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl font-medium text-sm transition-colors bg-white hover:bg-slate-100 text-indigo-600 font-bold">

        // --- SUB-VIEW: TIM MARKETING - LIST VOUCHERS (TABLE ONLY) ---
        function renderMarketingVouchers() {
            const myVouchers = vouchers.filter(v => v.createdBy === currentUser.name);
            
            let myVouchersHTML = '';
            if(myVouchers.length === 0) {
                myVouchersHTML = `
                <div class="p-10 text-center text-slate-500 flex flex-col items-center">
                    <i data-lucide="ticket" class="w-12 h-12 text-slate-200 mb-3"></i>
                    <p>Belum ada voucer yang pernah dibuat oleh Anda.</p>
                </div>`;
            } else {
                const rows = myVouchers.map(v => {
                    const isExpired = new Date(v.expiresAt) < new Date() && v.status !== 'used';
                    let statusBadge = '';
                    if (v.status === 'used') {
                        statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600">Terpakai</span>`;
                    } else if (isExpired) {
                        statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700">Kedaluwarsa</span>`;
                    } else {
                        statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">Aktif</span>`;
                    }

                    return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-4">
                            <p class="font-mono font-bold text-indigo-600">${v.code}</p>
                        </td>
                        <td class="p-4">
                            <p class="font-bold text-slate-800">${v.customerName}</p>
                            <p class="text-xs text-slate-500">${v.customerPhone || '-'}</p>
                        </td>
                        <td class="p-4 text-xs text-slate-500 max-w-[150px] truncate">${v.customerAddress || '-'}</td>
                        <td class="p-4 text-slate-600">${new Date(v.expiresAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="shareWhatsApp('${v.id}')" class="p-2 text-emerald-600 bg-emerald-50 hover:bg-emerald-100 rounded-lg transition-colors" title="Bagikan ke WhatsApp">
                                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                                </button>
                                <button onclick="downloadVoucher('${v.id}')" class="p-2 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition-colors" title="Download Gambar Tiket">
                                    <i data-lucide="download" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;
                }).join('');

                myVouchersHTML = `
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-100">

                            <th class="p-4 font-medium">Pelanggan</th>
                            <th class="p-4 font-medium">Alamat</th>
                            <th class="p-4 font-medium">Berlaku Sampai</th>
                            <th class="p-4 font-medium">Status</th>
                            <th class="p-4 font-medium text-right">Aksi</th>

                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm">${rows}</tbody>
                </table>`;

            return `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in max-w-5xl mx-auto">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-blue-100 text-blue-600 rounded-lg">
                            <i data-lucide="ticket" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-slate-800">Daftar Voucer Anda</h2>
                            <p class="text-xs text-slate-400 mt-0.5">Daftar seluruh tiket diskon yang telah Anda terbitkan</p>
                        </div>
                    </div>
                    <div class="text-sm text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full font-semibold">Total: ${myVouchers.length} Voucer</div>
                </div>
                <div class="overflow-x-auto">${myVouchersHTML}</div>
            </div>`;
        }

                            ${editingSaleId ? `

            if (activeAdminTab === 'verify') {

                contentHTML = renderAdminUsers();
            } else if (activeAdminTab === 'create_sale') {
                contentHTML = renderAdminCreateSale();

                contentHTML = renderAdminSalesHistory();

                            <div class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">
                                <i data-lucide="users" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h2 class="text-lg font-bold text-slate-800">Daftar Akun Tim Marketing</h2>
                                <p class="text-xs text-slate-400 mt-0.5">Daftar seluruh marketing yang memiliki hak akses sistem</p>
                            </div>
                        </div>
                        <div class="text-sm text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full font-semibold">Total: ${marketingUsers.length} Akun</div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-white text-slate-500 text-xs uppercase tracking-wider border-b border-slate-100">
                                    <th class="p-4 font-medium">Nama</th>
                                    <th class="p-4 font-medium">Username</th>
                                    <th class="p-4 font-medium">Password</th>
                                    <th class="p-4 font-medium">Role</th>
                                    <th class="p-4 font-medium">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">${usersRows}</tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }

        // --- SUB-VIEW: ADMIN CREATE SALE (FORM ONLY) ---
        function renderAdminCreateSale() {
            const editSale = editingSaleId ? sales.find(s => s.id === editingSaleId) : null;
            const formId = editingSaleId ? 'edit-sale-form' : 'create-sale-form';
            const formTitle = editingSaleId ? 'Edit Data Penjualan' : 'Form Pencatatan Kasir Pusat';
            const btnText = editingSaleId ? 'Simpan Perubahan' : 'Catat Penjualan';
            const btnClass = editingSaleId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-fuchsia-600 hover:bg-fuchsia-700';

            return `
            <div class="max-w-2xl mx-auto animate-fade-in mt-6">
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-3">
                            <div class="${editingSaleId ? 'bg-amber-100 text-amber-600' : 'bg-fuchsia-100 text-fuchsia-600'} p-3 rounded-xl">
                                <i data-lucide="${editingSaleId ? 'edit' : 'shopping-bag'}" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">${formTitle}</h2>
                                <p class="text-xs text-slate-500 mt-1">${editingSaleId ? 'Lakukan perubahan data transaksi tim marketing' : 'Input transaksi penjualan manual langsung dari Admin Pusat'}</p>
                            </div>
                        </div>
                        ${editingSaleId ? `<button type="button" onclick="cancelEditSale()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>` : ''}
                    </div>
                    
                    <form id="${formId}" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Pembeli *</label>
                                <input type="text" id="sale-pembeli" value="${editSale ? editSale.pembeli : ''}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-fuchsia-500 outline-none" />
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">No HP</label>
                                <input type="text" id="sale-hp" value="${editSale ? editSale.hp : ''}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-fuchsia-500 outline-none" />
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Alamat Lengkap</label>
                            <input type="text" id="sale-alamat" value="${editSale ? editSale.alamat : ''}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-fuchsia-500 outline-none" />
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Produk yang Dijual *</label>
                                <select id="sale-produk" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-fuchsia-500 bg-white outline-none">
                                    <option value="" disabled ${!editSale ? 'selected' : ''}>Pilih Produk...</option>
                                    <option value="Printer" ${editSale && editSale.produk === 'Printer' ? 'selected' : ''}>Printer</option>
                                    <option value="Laptop" ${editSale && editSale.produk === 'Laptop' ? 'selected' : ''}>Laptop</option>
                                    <option value="PC" ${editSale && editSale.produk === 'PC' ? 'selected' : ''}>PC</option>
                                    <option value="PC dan Printer" ${editSale && editSale.produk === 'PC dan Printer' ? 'selected' : ''}>PC dan Printer</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Kode Voucer (Jika Ada)</label>
                                <input type="text" id="sale-voucher" value="${editSale ? editSale.kodeVoucher : ''}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-fuchsia-500 uppercase outline-none" placeholder="Cth: VCH-12345" />
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Harga Final (Rp) *</label>
                            <input type="number" id="sale-harga" value="${editSale ? editSale.harga : ''}" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-fuchsia-500 font-semibold outline-none" placeholder="Cth: 150000" />
                        </div>
                        
                        <div class="flex gap-3 pt-2">
                            ${editingSaleId ? `
                            <button type="button" onclick="cancelEditSale()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-semibold transition-colors py-3">Batal</button>
                            ` : ''}
                            <button type="submit" class="${editingSaleId ? 'w-1/2' : 'w-full'} py-3 ${btnClass} text-white rounded-xl font-bold shadow-md transition-colors">${btnText}</button>
                        </div>
                    </form>
                </div>
            </div>`;
        }

        // --- SUB-VIEW: ADMIN SALES HISTORY (TABLE ONLY) ---
        function renderAdminSalesHistory() {
            let salesRows = '';
            
            if (sales.length === 0) {
                salesRows = `<tr><td colspan="10" class="p-6 text-center text-slate-500">Belum ada catatan penjualan dari seluruh tim marketing.</td></tr>`;
            } else {
                salesRows = sales.map((s, index) => `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4 text-slate-600 font-medium">${index + 1}</td>
                        <td class="p-4 text-slate-500 text-xs">${new Date(s.createdAt).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'})}</td>
                        <td class="p-4 font-bold text-blue-600">${s.createdBy}</td>
                        <td class="p-4 font-semibold text-slate-800">${s.pembeli}</td>
                        <td class="p-4 text-slate-600">${s.hp}</td>
                        <td class="p-4 text-slate-600 text-xs">${s.alamat}</td>
                        <td class="p-4 font-semibold text-fuchsia-600">${s.produk || '-'}</td>
                        <td class="p-4 font-mono text-slate-600">${s.kodeVoucher || '-'}</td>
                        <td class="p-4 font-semibold text-emerald-600">Rp ${Number(s.harga).toLocaleString('id-ID')}</td>
                        <td class="p-4">
                            <button onclick="startEditSale('${s.id}')" class="px-3 py-1.5 bg-amber-100 text-amber-700 hover:bg-amber-200 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1">
                                <i data-lucide="edit" class="w-3.5 h-3.5"></i> Edit
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            return `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mt-6 animate-fade-in max-w-6xl mx-auto">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">
                            <i data-lucide="database" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-slate-800">Semua Data Penjualan</h2>
                            <p class="text-xs text-slate-400 mt-0.5">Seluruh laporan transaksi dari tim marketing & pusat komputer</p>
                        </div>
                    </div>
                    <div class="text-sm text-fuchsia-600 bg-fuchsia-50 px-3 py-1 rounded-full font-semibold">Total: ${sales.length} Transaksi</div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[1000px]">
                        <thead>
                            <tr class="bg-white text-slate-500 text-xs uppercase tracking-wider border-b border-slate-100">
                                <th class="p-4 font-medium">No</th>
                                <th class="p-4 font-medium">Waktu Input</th>
                                <th class="p-4 font-medium">Tim Marketing</th>
                                <th class="p-4 font-medium">Pembeli</th>
                                <th class="p-4 font-medium">No. HP</th>
                                <th class="p-4 font-medium">Alamat</th>
                                <th class="p-4 font-medium">Produk</th>
                                <th class="p-4 font-medium">Kode Voucer</th>
                                <th class="p-4 font-medium">Harga</th>
                                <th class="p-4 font-medium">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-sm">
                            ${salesRows}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        // --- SUB-VIEW: ADMIN VERIFY ---
        function renderAdminVerify() {
            let resultHTML = '';
            if (searchResult) {
                if (searchResult.status === 'not_found') {
                    resultHTML = `
                    <div class="flex items-start gap-4 p-4 bg-red-50 text-red-700 rounded-xl border border-red-100">
                        <i data-lucide="x-circle" class="w-6 h-6 mt-0.5 shrink-0"></i>
                        <div>
                            <h4 class="font-bold">Voucer Tidak Ditemukan</h4>
                            <p class="text-sm opacity-90">Kode salah atau belum terdaftar.</p>
                        </div>
                    </div>`;
                } else if (searchResult.status === 'used') {
                    resultHTML = `
                    <div class="flex items-start gap-4 p-4 bg-amber-50 text-amber-800 rounded-xl border border-amber-200">
                        <i data-lucide="alert-triangle" class="w-6 h-6 mt-0.5 shrink-0"></i>
                        <div>
                            <h4 class="font-bold">Voucer Sudah Terpakai</h4>
                            <div class="mt-2 bg-white/60 p-3 rounded-lg text-sm">
                                <p>Pemilik: <strong>${searchResult.voucher.customerName}</strong></p>
                                <p>Dipakai: ${new Date(searchResult.voucher.usedAt).toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                    </div>`;
                } else if (searchResult.status === 'expired') {
                    resultHTML = `
                    <div class="flex items-start gap-4 p-4 bg-slate-100 text-slate-700 rounded-xl border border-slate-300">
                        <i data-lucide="clock" class="w-6 h-6 mt-0.5 shrink-0 text-slate-500"></i>
                        <div>
                            <h4 class="font-bold">Voucer Sudah Kedaluwarsa</h4>
                            <p class="text-sm opacity-90">Batas waktu penggunaan 1 minggu telah lewat.</p>
                            <p class="text-xs font-mono mt-1 bg-white inline-block px-2 py-1 rounded">Exp: ${new Date(searchResult.voucher.expiresAt).toLocaleDateString('id-ID')}</p>
                        </div>
                    </div>`;
                } else if (searchResult.status === 'found') {
                    resultHTML = `
                    <div class="bg-emerald-50 rounded-xl border border-emerald-200 overflow-hidden">
                        <div class="p-4 bg-emerald-500 text-white flex items-center gap-3">
                            <i data-lucide="check-circle" class="w-6 h-6"></i>
                            <h4 class="font-bold text-lg">Voucer Valid!</h4>
                        </div>
                        <div class="p-5 space-y-4">
                            <div class="grid grid-cols-2 gap-4 text-sm">
                                <div>
                                    <p class="text-emerald-700/70 font-medium mb-1">Kode</p>
                                    <p class="font-mono font-bold text-slate-800 text-lg">${searchResult.voucher.code}</p>
                                </div>
                                <div>
                                    <p class="text-emerald-700/70 font-medium mb-1">Pelanggan</p>
                                    <p class="font-bold text-slate-800 text-lg">${searchResult.voucher.customerName}</p>
                                </div>
                            </div>
                            <button onclick="handleRedeemVoucher()" class="w-full mt-2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-md active:scale-95 transition-all">
                                Gunakan Voucer
                            </button>
                        </div>
                    </div>`;
                }
            }

            const usedVouchers = vouchers.filter(v => v.status === 'used').reverse();
            let historyHTML = '';
            if (usedVouchers.length === 0) {
                historyHTML = `<div class="p-8 text-center text-slate-500">Belum ada voucer yang digunakan.</div>`;
            } else {
                const rows = usedVouchers.map(v => `
                    <tr>
                        <td class="p-4 text-slate-600">${new Date(v.usedAt).toLocaleString('id-ID', {hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'})}</td>
                        <td class="p-4 font-mono font-medium text-slate-700">${v.code}</td>
                        <td class="p-4 font-medium text-slate-800">${v.customerName}</td>
                    </tr>
                `).join('');
                historyHTML = `
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 border-y border-slate-100">
                        <tr>
                            <th class="p-4 font-medium text-slate-500">Waktu Dipakai</th>
                            <th class="p-4 font-medium text-slate-500">Kode</th>
                            <th class="p-4 font-medium text-slate-500">Pelanggan</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">${rows}</tbody>
                </table>`;
            }

            return `
            <div class="space-y-8 animate-fade-in">
                <!-- Scanner -->
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-2xl mx-auto">
                    <div class="text-center mb-8">
                        <div class="inline-block bg-emerald-100 p-3 rounded-2xl text-emerald-600 mb-4">
                            <i data-lucide="shield-check" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800">Verifikasi Kode Voucer</h2>
                    </div>

                    <form id="verify-form" class="relative max-w-md mx-auto">
                        <input type="text" id="search-code" placeholder="Cth: VCH-ABC123" class="w-full pl-12 pr-32 py-4 text-lg font-mono rounded-xl border-2 border-slate-200 focus:outline-none focus:ring-0 focus:border-emerald-500 uppercase font-bold outline-none" />
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-6 h-6"></i>
                        <button type="submit" class="absolute right-2 top-2 bottom-2 bg-slate-800 hover:bg-slate-900 text-white px-6 rounded-lg font-semibold">Cek</button>
                    </form>

                    <div class="mt-8 pt-8 border-t border-slate-100 max-w-md mx-auto">
                        ${resultHTML}
                    </div>
                </div>

                <!-- Log History -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden max-w-4xl mx-auto">
                    <div class="p-6 border-b border-slate-100">
                        <h3 class="font-bold text-slate-800">Voucer yang Telah Digunakan</h3>
                    </div>
                    <div class="overflow-x-auto">${historyHTML}</div>
                </div>
            </div>`;
        }

        // ==========================================
        // INISIALISASI & PENGIKATAN EVENT LISTENER
        // ==========================================
        function attachEventListeners() {
            // Form Login
            const loginForm = document.getElementById('login-form');
            if (loginForm) loginForm.addEventListener('submit', handleLogin);

            // Form Pembuatan Voucer
            const createVoucherForm = document.getElementById('create-voucher-form');
            if (createVoucherForm) createVoucherForm.addEventListener('submit', handleCreateVoucher);

            // Form Verifikasi Admin
            const verifyForm = document.getElementById('verify-form');
            if (verifyForm) verifyForm.addEventListener('submit', handleSearchVoucher);

            // Form Pembuatan Akun
            const createUserForm = document.getElementById('create-user-form');
            if (createUserForm) createUserForm.addEventListener('submit', handleCreateUser);

            // Form Edit Akun
            const editUserForm = document.getElementById('edit-user-form');
            if (editUserForm) editUserForm.addEventListener('submit', handleEditUserSubmit);

            // Form Tambah Penjualan
            const createSaleForm = document.getElementById('create-sale-form');
            if (createSaleForm) createSaleForm.addEventListener('submit', handleCreateSale);

            // Form Edit Penjualan
            const editSaleForm = document.getElementById('edit-sale-form');
            if (editSaleForm) editSaleForm.addEventListener('submit', handleEditSaleSubmit);
        }

        // Jalankan saat halaman pertama kali dimuat
        document.addEventListener('DOMContentLoaded', () => {
            reRender();
        });

    </script>
</body>
</html>
