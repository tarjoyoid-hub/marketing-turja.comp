<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistem Manajemen Voucer - Turja Computer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        *, ::before, ::after {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }
        .font-mono, .voucher-code-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .bg-dots {
            background-image: radial-gradient(rgba(99, 102, 241, 0.05) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 bg-dots text-slate-800 flex flex-col justify-between">

    <div id="app" class="w-full flex-grow max-w-5xl mx-auto p-6"></div>

    <div id="toast-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none"></div>

    <script>
        // Ganti URL deploy Google Apps Script Web App Anda
        const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbz08Z-wbaljZEtL721dDIRkm8TlwVryfr4LSmRQZbpDn5c2ix4AuHP3Bv9JkDDzLQJv/exec/exec';

        async function sendDataToSheet(data, sheetName) {
            try {
                const url = GOOGLE_SHEETS_URL + '?sheet=' + encodeURIComponent(sheetName);
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                const json = await res.json();
                if(json.status === 'success') {
                    console.log(`Data berhasil dikirim ke sheet "${sheetName}"`);
                    return true;
                } else {
                    console.error('Gagal kirim data:', json.message);
                    return false;
                }
            } catch (error) {
                console.error('Error kirim ke Google Sheets:', error);
                return false;
            }
        }

        // Simpan sementara data untuk demo
        let users = [
            { id: '1', name: 'Administrator Utama', username: 'admin', password: '123', role: 'admin' }
        ];
        let vouchers = [];
        let sales = [];
        let voucherClaims = [];
        let currentUser = null;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            container.innerHTML = '';
            const toast = document.createElement('div');
            toast.className = `p-6 rounded-3xl flex flex-col items-center text-center gap-4 shadow-2xl border border-slate-200 bg-white text-sm pointer-events-auto transition-all duration-300 transform scale-95 opacity-0 animate-fade-in max-w-sm w-full`;
            let icon = 'check-circle', iconColor = 'text-emerald-500', borderColor = 'border-emerald-500/20', bgIcon = 'bg-emerald-500/10';
            if(type === 'error') {
                icon = 'x-circle'; iconColor = 'text-red-500'; borderColor='border-red-500/20'; bgIcon='bg-red-500/10';
            } else if(type === 'warning') {
                icon = 'alert-triangle'; iconColor='text-amber-500'; borderColor='border-amber-500/20'; bgIcon='bg-amber-500/10';
            }
            toast.innerHTML = `
                <div class="w-16 h-16 ${bgIcon} ${iconColor} rounded-full flex items-center justify-center border ${borderColor}">
                    <i data-lucide="${icon}" class="w-8 h-8"></i>
                </div>
                <div class="text-slate-800 font-semibold text-base leading-relaxed">${message}</div>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(()=> {
                toast.classList.remove('scale-95', 'opacity-0');
                toast.classList.add('scale-100', 'opacity-100');
            }, 10);
            setTimeout(() => {
                toast.classList.remove('scale-100', 'opacity-100');
                toast.classList.add('scale-95', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Generate kode voucher
        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let res = 'VCH-';
            for(let i=0; i<6; i++) {
                res += chars.charAt(Math.floor(Math.random()*chars.length));
            }
            return res;
        }

        // --- Renders and Handlers ---

        function renderLogin() {
            return `
                <div class="min-h-screen flex flex-col justify-center items-center p-4">
                    <h1 class="text-4xl font-extrabold mb-8">TURJA COMPUTER LOGIN</h1>
                    <form id="login-form" class="flex flex-col gap-4 w-full max-w-sm">
                        <input type="text" id="username" placeholder="Username" class="p-3 rounded border" required autocomplete="username"/>
                        <input type="password" id="password" placeholder="Password" class="p-3 rounded border" required autocomplete="current-password"/>
                        <button type="submit" class="bg-red-500 text-white p-3 rounded font-bold hover:bg-red-600 transition">Login</button>
                    </form>
                </div>
            `;
        }

        function renderDashboard() {
            return `
                <div>
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">Selamat datang, ${currentUser.name}</h2>
                        <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">Keluar</button>
                    </div>

                    <section class="mb-10 bg-white p-6 rounded shadow">
                        <h3 class="font-bold mb-4">Daftar Akun Marketing</h3>
                        <form id="create-user-form" class="space-y-4 max-w-md mb-6">
                            <input id="new-name" type="text" placeholder="Nama Lengkap" class="w-full p-3 border rounded" required />
                            <input id="new-username" type="text" placeholder="Username" class="w-full p-3 border rounded" required />
                            <input id="new-password" type="password" placeholder="Password" class="w-full p-3 border rounded" required />
                            <button type="submit" class="bg-blue-600 text-white px-5 py-3 rounded font-bold hover:bg-blue-700 transition w-full">Daftarkan Akun</button>
                        </form>
                        <table class="w-full text-left border-collapse border border-slate-300">
                            <thead>
                                <tr class="bg-slate-100">
                                    <th class="border border-slate-300 p-2">Nama</th>
                                    <th class="border border-slate-300 p-2">Username</th>
                                    <th class="border border-slate-300 p-2">Akses Hak</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${users.filter(u => u.role==='marketing').map(u => `
                                    <tr>
                                        <td class="border border-slate-300 p-2">${u.name}</td>
                                        <td class="border border-slate-300 p-2">${u.username}</td>
                                        <td class="border border-slate-300 p-2">${u.role}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </section>

                    <section class="mb-10 bg-white p-6 rounded shadow max-w-2xl">
                        <h3 class="font-bold mb-4">Input Data Penjualan</h3>
                        <form id="create-sale-form" class="space-y-4">
                            <input id="sale-buyer" type="text" placeholder="Nama Pembeli" class="w-full p-3 border rounded" required />
                            <input id="sale-phone" type="tel" placeholder="No. HP Pembeli" class="w-full p-3 border rounded" required />
                            <input id="sale-address" type="text" placeholder="Alamat Pembeli" class="w-full p-3 border rounded" required />
                            <input id="sale-category" type="text" placeholder="Kategori Produk" class="w-full p-3 border rounded" required />
                            <input id="sale-product" type="text" placeholder="Nama Produk" class="w-full p-3 border rounded" required />
                            <input id="sale-voucher" type="text" placeholder="Kode Voucer Klaim (opsional)" class="w-full p-3 border rounded" />
                            <input id="sale-price" type="number" placeholder="Harga Final" class="w-full p-3 border rounded" required min="0" />
                            <button type="submit" class="bg-green-600 text-white px-5 py-3 rounded font-bold hover:bg-green-700 transition w-full">Tambah Penjualan</button>
                        </form>
                    </section>

                    <section class="mb-10 bg-white p-6 rounded shadow max-w-2xl">
                        <h3 class="font-bold mb-4">Buat Voucer Baru</h3>
                        <form id="create-voucher-form" class="space-y-4">
                            <input id="cust-name" type="text" placeholder="Nama Pelanggan" class="w-full p-3 border rounded" required />
                            <input id="cust-phone" type="tel" placeholder="No. WhatsApp Pelanggan" class="w-full p-3 border rounded" required />
                            <input id="cust-address" type="text" placeholder="Alamat Pelanggan" class="w-full p-3 border rounded" required />
                            <button type="submit" class="bg-indigo-600 text-white px-5 py-3 rounded font-bold hover:bg-indigo-700 transition w-full">Generate Voucher</button>
                        </form>
                        <div id="voucher-result" class="mt-6 font-mono text-lg text-indigo-700"></div>
                    </section>

                    <section class="mb-10 bg-white p-6 rounded shadow max-w-2xl">
                        <h3 class="font-bold mb-4">Riwayat Voucer yang Diklaim</h3>
                        <table class="w-full text-left border-collapse border border-slate-300 text-sm">
                            <thead>
                                <tr class="bg-slate-100">
                                    <th class="border border-slate-300 p-2">Kode Voucer</th>
                                    <th class="border border-slate-300 p-2">Waktu Klaim</th>
                                    <th class="border border-slate-300 p-2">Pembeli</th>
                                    <th class="border border-slate-300 p-2">Tim Marketing</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${voucherClaims.map(v => `
                                    <tr>
                                        <td class="border border-slate-300 p-2 font-mono">${v.voucherCode}</td>
                                        <td class="border border-slate-300 p-2">${new Date(v.claimedAt).toLocaleString()}</td>
                                        <td class="border border-slate-300 p-2">${v.buyerName}</td>
                                        <td class="border border-slate-300 p-2">${v.marketingTeam}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </section>
                </div>
            `;
        }

        // Event handlers:

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const user = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
            if(user) {
                currentUser = user;
                showToast(`Selamat datang kembali, ${user.name}!`);
                reRender();
            } else {
                showToast('Username atau password salah.', 'error');
            }
        }

        function handleLogout() {
            currentUser = null;
            showToast('Anda telah keluar dari sistem.');
            reRender();
        }

        // Create Marketing User & send to "User" sheet
        async function handleCreateUser(e) {
            e.preventDefault();
            const name = document.getElementById('new-name').value.trim();
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value;
            if(users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                showToast("Username sudah digunakan. Silakan cari yang lain.", "error");
                return;
            }
            const newUser = {
                id: Date.now().toString(),
                name,
                username,
                password,
                role: 'marketing'
            };
            users.push(newUser);
            const success = await sendDataToSheet({
                NamaLengkap: newUser.name,
                Username: newUser.username,
                Password: newUser.password,
                AksesHak: newUser.role
            }, 'User');
            if(success) showToast(`Akun marketing "${name}" berhasil didaftarkan!`);
            else showToast(`Gagal kirim data user ke Google Sheets`, 'error');
            reRender();
        }

        // Create Voucher & send to "Voucher" sheet
        async function handleCreateVoucher(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            if(!name || !phone || !address) {
                showToast('Harap isi semua field!', 'error');
                return;
            }
            const now = new Date();
            const expiryDate = new Date(now.getTime() + 7*24*60*60*1000);

            const newVoucher = {
                Kode: generateRandomCode(),
                Pelanggan: name,
                Alamat: address,
                BerlakuSampai: expiryDate.toISOString(),
                Status: 'active',
                CreatedBy: currentUser.name,
                CreatedAt: now.toISOString(),
            };
            vouchers.unshift(newVoucher);

            const success = await sendDataToSheet(newVoucher, 'Voucher');
            if(success) {
                showToast(`Voucher baru berhasil diterbitkan! Kode: ${newVoucher.Kode}`);
                document.getElementById('voucher-result').textContent = `Kode Voucher: ${newVoucher.Kode}`;
                document.getElementById('create-voucher-form').reset();
            } else {
                showToast('Gagal kirim data voucher ke Google Sheets', 'error');
            }
            reRender();
        }

        // Input Data Penjualan & send to "Penjualan" sheet
        async function handleCreateSale(e) {
            e.preventDefault();
            const buyer = document.getElementById('sale-buyer').value.trim();
            const phone = document.getElementById('sale-phone').value.trim();
            const address = document.getElementById('sale-address').value.trim();
            const category = document.getElementById('sale-category').value.trim();
            const product = document.getElementById('sale-product').value.trim();
            const voucherClaim = document.getElementById('sale-voucher').value.trim();
            const priceStr = document.getElementById('sale-price').value.trim();

            if (!buyer || !phone || !address || !category || !product || !priceStr) {
                showToast('Harap isi semua field yang diperlukan!', 'error');
                return;
            }

            const price = Number(priceStr);
            if (isNaN(price) || price < 0) {
                showToast('Harga final harus angka valid dan positif!', 'error');
                return;
            }

            const now = new Date();

            // Buat entri penjualan
            const newSale = {
                No: (sales.length + 1).toString(),
                WaktuInput: now.toISOString(),
                TimMarketing: currentUser.name,
                Pembeli: buyer,
                NoHP: phone,
                Alamat: address,
                Kategori: category,
                Produk: product,
                VoucerKlaim: voucherClaim || '',
                HargaFinal: price
            };

            sales.push(newSale);

            const successPenjualan = await sendDataToSheet(newSale, 'Penjualan');

            // Jika ada voucher klaim, simpan ke "Voucher Klaim"
            if (voucherClaim) {
                const newVoucherClaim = {
                    voucherCode: voucherClaim,
                    claimedAt: now.toISOString(),
                    buyerName: buyer,
                    marketingTeam: currentUser.name
                };
                voucherClaims.unshift(newVoucherClaim);
                const successVoucherClaim = await sendDataToSheet(newVoucherClaim, 'Voucher Klaim');
                if (!successVoucherClaim) showToast('Gagal kirim data Voucher Klaim ke Google Sheets', 'error');
            }

            if (successPenjualan) {
                showToast('Data penjualan berhasil ditambahkan.');
                document.getElementById('create-sale-form').reset();
            } else {
                showToast('Gagal kirim data penjualan ke Google Sheets', 'error');
            }
            reRender();
        }

        // Render app container
        function reRender() {
            const app = document.getElementById('app');
            if(!currentUser) {
                app.innerHTML = renderLogin();
                const loginForm = document.getElementById('login-form');
                if(loginForm) loginForm.addEventListener('submit', handleLogin);
            } else {
                app.innerHTML = renderDashboard();
                document.getElementById('logout-btn')?.addEventListener('click', handleLogout);
                document.getElementById('create-user-form')?.addEventListener('submit', handleCreateUser);
                document.getElementById('create-voucher-form')?.addEventListener('submit', handleCreateVoucher);
                document.getElementById('create-sale-form')?.addEventListener('submit', handleCreateSale);
            }
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            reRender();
        });
    </script>

</body>
</html>
