<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Voucer - Turja Computer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Menggunakan font Inter dan Fira Code untuk tampilan yang jauh lebih modern dan bersih */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: -0.01em;
        }
        
        .font-mono {
            font-family: 'Fira Code', monospace;
        }

        /* Smooth Fade In Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Tech Dot Grid Background pattern untuk Mode Terang */
        .bg-dots {
            background-image: radial-gradient(rgba(99, 102, 241, 0.05) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        
        /* Glassmorphism effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 bg-dots text-slate-800 flex flex-col justify-between">

    <!-- Container Utama -->
    <div id="app" class="w-full flex-grow"></div>

    <!-- Container Toast Notification Custom -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Custom Modal Confirm Container -->
    <div id="confirm-modal-container" class="fixed inset-0 bg-slate-900/45 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-all duration-300">
        <div class="bg-white border border-slate-100 rounded-3xl p-6 max-w-sm w-full shadow-2xl animate-fade-in text-center">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-200">
                <i data-lucide="help-circle" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-2" id="modal-title">Konfirmasi Tindakan</h3>
            <p class="text-slate-500 text-sm mb-6 leading-relaxed" id="modal-desc">Apakah Anda yakin ingin melanjutkan tindakan ini?</p>
            <div class="flex gap-3">
                <button id="modal-cancel-btn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition-all">Batal</button>
                <button id="modal-confirm-btn" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-indigo-600/30">Ya, Setuju</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // MANAJEMEN STATE & DATA (Menggunakan LocalStorage)
        // ==========================================
        const defaultUsers = [
            { id: '1', username: 'admin', password: 'password123', role: 'admin', name: 'Administrator Utama' }
        ];

        let users = JSON.parse(localStorage.getItem('tc_users')) || defaultUsers;
        let vouchers = JSON.parse(localStorage.getItem('tc_vouchers')) || [];
        let sales = JSON.parse(localStorage.getItem('tc_sales')) || [];
        let currentUser = JSON.parse(localStorage.getItem('tc_currentUser')) || null;
        
        // State UI
        let activeAdminTab = 'verify';
        let activeMarketingTab = 'create_voucher';
        let generatedVoucher = null;
        let searchResult = null;
        let loginError = '';
        let editingUserId = null; 
        let editingSaleId = null; 

        function saveData() {
            localStorage.setItem('tc_users', JSON.stringify(users));
            localStorage.setItem('tc_vouchers', JSON.stringify(vouchers));
            localStorage.setItem('tc_sales', JSON.stringify(sales));
            localStorage.setItem('tc_currentUser', JSON.stringify(currentUser));
        }

        function reRender() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderDashboard();
            }
            // Render ulang icon Lucide setelah DOM berubah
            lucide.createIcons();
            
            // Pasang Event Listeners setelah HTML dirender
            attachEventListeners();
        }

        // ==========================================
        // SYSTEM TOAST NOTIFICATION & MODAL CUSTOM
        // ==========================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl flex items-center gap-3 shadow-xl border text-sm pointer-events-auto transition-all duration-300 transform translate-y-2 opacity-0 glass-card animate-fade-in`;
            
            let icon = 'check-circle';
            let iconColor = 'text-emerald-500';
            let borderColor = 'border-emerald-500/20';
            let textColor = 'text-slate-800';

            if (type === 'error') {
                icon = 'x-circle';
                iconColor = 'text-red-500';
                borderColor = 'border-red-500/20';
            } else if (type === 'warning') {
                icon = 'alert-triangle';
                iconColor = 'text-amber-500';
                borderColor = 'border-amber-500/20';
            }

            toast.innerHTML = `
                <div class="${iconColor}"><i data-lucide="${icon}" class="w-5 h-5"></i></div>
                <div class="${textColor} font-semibold">${message}</div>
            `;
            toast.classList.add(borderColor);
            container.appendChild(toast);
            lucide.createIcons();

            // Animasi masuk
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            // Hapus otomatis setelah 3 detik
            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        function showCustomConfirm(title, description, onConfirm) {
            const modal = document.getElementById('confirm-modal-container');
            const titleEl = document.getElementById('modal-title');
            const descEl = document.getElementById('modal-desc');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            titleEl.textContent = title;
            descEl.textContent = description;
            modal.classList.remove('hidden');

            const cleanUp = () => {
                modal.classList.add('hidden');
                confirmBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            confirmBtn.onclick = () => {
                cleanUp();
                onConfirm();
            };

            cancelBtn.onclick = () => {
                cleanUp();
            };
        }

        // ==========================================
        // FUNGSI AKSI (LOGIC)
        // ==========================================
        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            
            const user = users.find(u => u.username === usernameInput && u.password === passwordInput);
            if (user) {
                currentUser = user;
                loginError = '';
                saveData();
                reRender();
                showToast(`Selamat datang kembali, ${user.name}!`);
            } else {
                loginError = 'Username atau password salah.';
                reRender();
            }
        }

        function handleLogout() {
            currentUser = null;
            generatedVoucher = null;
            searchResult = null;
            saveData();
            reRender();
            showToast('Anda telah keluar dari sistem.');
        }

        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'VCH-';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function handleCreateVoucher(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            if (!name.trim()) return;

            const now = new Date();
            const expiryDate = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000); // +7 Hari

            const newVoucher = {
                id: Date.now().toString(),
                code: generateRandomCode(),
                customerName: name,
                customerPhone: phone,
                customerAddress: address,
                status: 'active',
                createdBy: currentUser.name,
                createdAt: now.toISOString(),
                expiresAt: expiryDate.toISOString(),
                usedAt: null
            };

            vouchers.unshift(newVoucher); 
            generatedVoucher = newVoucher;
            saveData();
            showToast('Voucer baru senilai 100 Rb berhasil diterbitkan!', 'success');
            reRender();
        }

        function handleSearchVoucher(e) {
            e.preventDefault();
            const code = document.getElementById('search-code').value.toUpperCase().trim();
            if (!code) return;

            const voucher = vouchers.find(v => v.code === code);
            
            if (!voucher) {
                searchResult = { status: 'not_found', voucher: null };
                showToast('Voucer tidak ditemukan!', 'error');
            } else {
                const isExpired = new Date(voucher.expiresAt) < new Date();
                if (voucher.status === 'used') {
                    searchResult = { status: 'used', voucher: voucher };
                    showToast('Voucer ini sudah pernah terpakai!', 'warning');
                } else if (isExpired) {
                    searchResult = { status: 'expired', voucher: voucher };
                    showToast('Masa aktif voucer sudah habis!', 'error');
                } else {
                    searchResult = { status: 'found', voucher: voucher };
                    showToast('Voucer valid dan siap digunakan!', 'success');
                }
            }
            reRender();
        }

        function handleRedeemVoucher() {
            if (searchResult?.status !== 'found') return;

            showCustomConfirm(
                "Klaim Potongan Harga?",
                `Apakah Anda yakin ingin memverifikasi voucer milik ${searchResult.voucher.customerName} untuk potongan Rp 100.000?`,
                () => {
                    const voucherIndex = vouchers.findIndex(v => v.id === searchResult.voucher.id);
                    if(voucherIndex > -1) {
                        vouchers[voucherIndex].status = 'used';
                        vouchers[voucherIndex].usedAt = new Date().toISOString();
                        
                        searchResult = { 
                            status: 'used', 
                            voucher: vouchers[voucherIndex] 
                        };
                        saveData();
                        showToast('Voucer sukses diverifikasi dan digunakan!');
                        reRender();
                    }
                }
            );
        }

        function handleCreateUser(e) {
            e.preventDefault();
            const newName = document.getElementById('new-name').value;
            const newUsername = document.getElementById('new-username').value;
            const newPassword = document.getElementById('new-password').value;

            if (users.find(u => u.username === newUsername)) {
                showToast("Username sudah digunakan. Silakan cari yang lain.", "error");
                return;
            }
            
            const newUser = {
                id: Date.now().toString(),
                username: newUsername,
                password: newPassword,
                role: 'marketing',
                name: newName
            };
            
            users.push(newUser);
            saveData();
            showToast(`Akun marketing "${newName}" berhasil didaftarkan!`);
            activeAdminTab = 'users'; 
            reRender();
        }

        function handleEditUserSubmit(e) {
            e.preventDefault();
            const updatedName = document.getElementById('new-name').value;
            const updatedUsername = document.getElementById('new-username').value;
            const updatedPassword = document.getElementById('new-password').value;

            if (users.find(u => u.username === updatedUsername && u.id !== editingUserId)) {
                showToast("Username ini sudah dipakai oleh akun lain.", "error");
                return;
            }

            const userIndex = users.findIndex(u => u.id === editingUserId);
            if (userIndex > -1) {
                users[userIndex].name = updatedName;
                users[userIndex].username = updatedUsername;
                users[userIndex].password = updatedPassword;
                saveData();
                showToast(`Akun marketing "${updatedName}" berhasil diperbarui!`);
            }

            editingUserId = null;
            activeAdminTab = 'users'; 
            reRender();
        }

        window.startEditUser = function(id) {
            editingUserId = id;
            activeAdminTab = 'create_user'; 
            reRender();
        }

        window.cancelEditUser = function() {
            editingUserId = null;
            activeAdminTab = 'users'; 
            reRender();
        }

        // ==========================================
        // FUNGSI PENJUALAN (MARKETING & ADMIN)
        // ==========================================
        window.switchMarketingTab = function(tab) {
            activeMarketingTab = tab;
            editingSaleId = null; 
            reRender();
        }

        function handleCreateSale(e) {
            e.preventDefault();
            const newSale = {
                id: Date.now().toString(),
                pembeli: document.getElementById('sale-pembeli').value,
                hp: document.getElementById('sale-hp').value,
                alamat: document.getElementById('sale-alamat').value,
                produk: document.getElementById('sale-produk').value,
                kodeVoucher: document.getElementById('sale-voucher').value,
                harga: document.getElementById('sale-harga').value,
                createdBy: currentUser.name,
                createdAt: new Date().toISOString()
            };
            sales.unshift(newSale); 
            saveData();
            showToast('Laporan penjualan baru berhasil tersimpan!');
            
            if (currentUser.role === 'marketing') {
                activeMarketingTab = 'sales_history';
            } else {
                activeAdminTab = 'sales_history';
            }
            reRender();
        }

        // Edit penjualan
        function handleEditSaleSubmit(e) {
            e.preventDefault();
            const index = sales.findIndex(s => s.id === editingSaleId);
            if (index > -1) {
                sales[index].pembeli = document.getElementById('sale-pembeli').value;
                sales[index].hp = document.getElementById('sale-hp').value;
                sales[index].alamat = document.getElementById('sale-alamat').value;
                sales[index].produk = document.getElementById('sale-produk').value;
                sales[index].kodeVoucher = document.getElementById('sale-voucher').value;
                sales[index].harga = document.getElementById('sale-harga').value;
                saveData();
                showToast('Laporan penjualan berhasil dimodifikasi!');
            }
            editingSaleId = null;
            
            if (currentUser.role === 'marketing') {
                activeMarketingTab = 'sales_history';
            } else {
                activeAdminTab = 'sales_history';
            }
            reRender();
        }

        window.startEditSale = function(id) {
            editingSaleId = id;
            if (currentUser.role === 'marketing') {
                activeMarketingTab = 'create_sale';
            } else {
                activeAdminTab = 'create_sale';
            }
            reRender();
        }

        window.cancelEditSale = function() {
            editingSaleId = null;
            if (currentUser.role === 'marketing') {
                activeMarketingTab = 'sales_history';
            } else {
                activeAdminTab = 'sales_history';
            }
            reRender();
        }

        // ==========================================
        // FUNGSI CANVAS & WHATSAPP
        // ==========================================
        function getVoucherById(id) {
            return vouchers.find(v => v.id === id);
        }

        function generateVoucherCanvas(voucher) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');

            // Background Utama Gradasi Cyberpunk Premium
            const gradient = ctx.createLinearGradient(0, 0, 800, 400);
            gradient.addColorStop(0, '#0f172a'); // Slate 900
            gradient.addColorStop(0.5, '#1e1b4b'); // Indigo 950
            gradient.addColorStop(1, '#311042'); // Purple 950
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 800, 400);

            // Aksen Tech Grid / Ornamen
            ctx.fillStyle = 'rgba(99, 102, 241, 0.05)';
            for(let i=0; i<800; i+=40) {
                ctx.fillRect(i, 0, 2, 400);
            }
            for(let j=0; j<400; j+=40) {
                ctx.fillRect(0, j, 800, 2);
            }

            // Garis Putus-putus
            ctx.beginPath();
            ctx.setLineDash([10, 15]);
            ctx.moveTo(560, 0);
            ctx.lineTo(560, 400);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Potongan Tiket Gunting
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(560, 0, 25, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(560, 400, 25, 0, Math.PI * 2); ctx.fill();

            // Teks Toko
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px sans-serif';
            ctx.fillText('TURJA COMPUTER', 50, 75);

            // Sub judul toko
            ctx.fillStyle = 'rgba(99, 102, 241, 0.8)';
            ctx.font = '600 14px sans-serif';
            ctx.fillText('CYBER SECURITY & COMPUTER RETAIL', 50, 105);

            // Nilai Voucer
            ctx.font = '800 84px sans-serif';
            // Gradasi teks untuk nilai voucer
            const textGrad = ctx.createLinearGradient(50, 120, 250, 200);
            textGrad.addColorStop(0, '#fde047');
            textGrad.addColorStop(1, '#f97316');
            ctx.fillStyle = textGrad;
            ctx.fillText('100 Rb', 50, 185);

            // Box Kode
            ctx.fillStyle = 'rgba(99, 102, 241, 0.12)';
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.3)';
            ctx.lineWidth = 2;
            if(ctx.roundRect) {
                ctx.beginPath(); ctx.roundRect(50, 205, 400, 75, 12); ctx.fill(); ctx.stroke();
            } else {
                ctx.fillRect(50, 205, 400, 75); 
            }
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px monospace';
            ctx.fillText(voucher.code, 85, 258);

            // Info Pelanggan
            ctx.font = '500 16px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillText('PENERIMA', 50, 315);
            ctx.fillText('WHATSAPP', 230, 315);
            ctx.fillText('ALAMAT', 50, 365);

            ctx.font = 'bold 18px sans-serif';
            ctx.fillStyle = '#f8fafc';
            let custName = voucher.customerName.toUpperCase();
            if(custName.length > 18) custName = custName.substring(0, 18) + '...';
            ctx.fillText(custName, 50, 340);
            ctx.fillText(voucher.customerPhone || '-', 230, 340);
            
            let custAddr = voucher.customerAddress || '-';
            if(custAddr.length > 45) custAddr = custAddr.substring(0, 45) + '...';
            ctx.fillText(custAddr, 150, 365);

            // Info Kanan (Masa Berlaku)
            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillText('MASA AKTIF', 600, 75);
            
            ctx.font = 'bold 22px sans-serif';
            ctx.fillStyle = '#ef4444';
            const dateStr = new Date(voucher.expiresAt).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'});
            ctx.fillText(dateStr, 600, 110);

            ctx.font = '800 14px sans-serif';
            ctx.fillStyle = '#a855f7';
            ctx.fillText('TURJA PREMIUM PASS', 600, 250);

            ctx.font = '13px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillText('Tunjukkan voucer', 600, 310);
            ctx.fillText('ke kasir komputer', 600, 330);
            ctx.fillText('sebagai bukti.', 600, 350);

            return canvas;
        }

        window.downloadVoucher = function(id) {
            const voucher = getVoucherById(id);
            if(!voucher) return;
            const canvas = generateVoucherCanvas(voucher);
            const link = document.createElement('a');
            link.download = `Voucher-TurjaComputer-${voucher.code}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('Desain voucer berhasil di-download!', 'success');
        }

        window.shareWhatsApp = function(id) {
            const voucher = getVoucherById(id);
            if(!voucher) return;
            const expDate = new Date(voucher.expiresAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            const text = `Halo *${voucher.customerName}*! 🎉\n\nIni adalah VOUCER SPESIAL senilai *100 Rb* dari *Turja Computer* untuk Anda.\n\nKode Voucer: *${voucher.code}*\nBerlaku sampai: *${expDate}*\n\nAlamat yang tercatat: ${voucher.customerAddress || '-'}\n\nSilakan tunjukkan pesan ini atau gambar voucer kepada admin di toko kami untuk mendapatkan potongan harga.\n\nTerima kasih!`;
            
            let waUrl = `https://wa.me/`;
            if (voucher.customerPhone) {
                let phone = voucher.customerPhone.replace(/\D/g, ''); 
                if (phone.startsWith('0')) phone = '62' + phone.substring(1); 
                waUrl += `${phone}?text=${encodeURIComponent(text)}`;
            } else {
                waUrl += `?text=${encodeURIComponent(text)}`;
            }
            window.open(waUrl, '_blank');
        }

        window.switchAdminTab = function(tab) {
            activeAdminTab = tab;
            editingSaleId = null; 
            reRender();
        }

        // ==========================================
        // FUNGSI RENDER HTML
        // ==========================================
        
        // --- VIEW: LOGIN (Light Premium Design) ---
        function renderLogin() {
            return `
            <div class="min-h-screen flex flex-col items-center justify-center p-4">
                <div class="mb-6 text-center animate-fade-in">
                    <div class="bg-gradient-to-tr from-indigo-500 to-indigo-600 inline-block p-4 rounded-3xl text-white shadow-2xl shadow-indigo-600/10 border border-indigo-400/20 mb-4">
                        <i data-lucide="cpu" class="w-14 h-14"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">TURJA COMPUTER</h1>
                    <p class="text-indigo-600 text-sm font-semibold tracking-wider mt-1">Cyber Portal & Voucher Hub</p>
                </div>

                <div class="bg-white p-8 rounded-3xl shadow-xl shadow-slate-200/80 w-full max-w-md border border-slate-200/60 animate-fade-in relative overflow-hidden">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-50/5 rounded-full blur-xl"></div>
                    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-fuchsia-50/5 rounded-full blur-xl"></div>

                    <form id="login-form" class="space-y-5 relative z-10">
                        ${loginError ? `
                        <div class="bg-red-50 text-red-600 border border-red-200 p-3.5 rounded-xl text-sm flex items-center gap-2">
                            <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i> ${loginError}
                        </div>` : ''}
                        
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Username</label>
                            <div class="relative">
                                <input type="text" id="username" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none rounded-xl text-slate-800 text-sm transition-all" placeholder="Masukkan username" required />
                                <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Password</label>
                            <div class="relative">
                                <input type="password" id="password" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none rounded-xl text-slate-800 text-sm transition-all" placeholder="••••••••" required />
                                <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                            </div>
                        </div>

                                <th class="p-4 font-bold">Alamat</th>
                                <th class="p-4 font-bold">Kategori Produk</th>
                                <th class="p-4 font-bold">Voucer Klaim</th>
                                <th class="p-4 font-bold">Harga Final</th>
                                <th class="p-4 font-bold">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-sm">
                            ${salesRows}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        // --- SUB-VIEW: ADMIN VERIFY (Clean Light Scanner) ---
        function renderAdminVerify() {
            let resultHTML = '';
            if (searchResult) {
                if (searchResult.status === 'not_found') {
                    resultHTML = `
                    <div class="flex items-start gap-4 p-4 bg-red-50 text-red-655 rounded-xl border border-red-200">
                        <i data-lucide="x-circle" class="w-6 h-6 mt-0.5 shrink-0 text-red-500"></i>
                        <div>
                            <h4 class="font-bold">Voucer Tidak Terdaftar</h4>
                            <p class="text-xs opacity-90 mt-1 text-slate-600">Kode voucer yang dimasukkan tidak ditemukan di sistem.</p>
                        </div>
                    </div>`;
                } else if (searchResult.status === 'used') {
                    resultHTML = `
                    <div class="flex items-start gap-4 p-4 bg-amber-50 text-amber-700 rounded-xl border border-amber-200 animate-fade-in">
                        <i data-lucide="alert-triangle" class="w-6 h-6 mt-0.5 shrink-0 text-amber-500"></i>
                        <div>
                            <h4 class="font-bold">Voucer Sudah Pernah Terpakai</h4>
                            <div class="mt-3 bg-white p-3.5 rounded-xl border border-amber-200 text-xs text-slate-700">
                                <p class="mb-1"><span class="text-slate-400">Pemilik:</span> <strong class="text-slate-900">${searchResult.voucher.customerName}</strong></p>
                                <p><span class="text-slate-400">Dipakai Pada:</span> <strong class="text-slate-900">${new Date(searchResult.voucher.usedAt).toLocaleString('id-ID')}</strong></p>
                            </div>
                        </div>
                    </div>`;
                } else if (searchResult.status === 'expired') {
                    resultHTML = `
                    <div class="flex items-start gap-4 p-4 bg-slate-50 text-slate-600 rounded-xl border border-slate-200 animate-fade-in">
                        <i data-lucide="clock" class="w-6 h-6 mt-0.5 shrink-0 text-slate-400"></i>
                        <div>
                            <h4 class="font-bold text-slate-800">Voucer Kedaluwarsa</h4>
                            <p class="text-xs opacity-90 mt-1">Voucer melebihi batas promo 1 minggu yang ditentukan.</p>
                            <p class="text-[10px] font-mono mt-2 bg-white text-red-600 border border-slate-200 inline-block px-2.5 py-1 rounded-lg">Exp: ${new Date(searchResult.voucher.expiresAt).toLocaleDateString('id-ID')}</p>
                        </div>
                    </div>`;
                } else if (searchResult.status === 'found') {
                    resultHTML = `
                    <div class="bg-emerald-50/50 rounded-xl border border-emerald-200 overflow-hidden animate-fade-in">
                        <div class="p-4 bg-emerald-600 text-white flex items-center gap-3">
                            <i data-lucide="check-circle" class="w-6 h-6"></i>
                            <h4 class="font-bold">Voucer Terverifikasi Valid!</h4>
                        </div>
                        <div class="p-5 space-y-4 text-slate-700">
                            <div class="grid grid-cols-2 gap-4 text-xs">
                                <div>
                                    <p class="text-slate-400 font-bold mb-1 uppercase tracking-wider">KODE VOUCER</p>
                                    <p class="font-mono font-bold text-indigo-600 bg-indigo-50 py-1.5 px-3 rounded-lg border border-indigo-100 inline-block">${searchResult.voucher.code}</p>
                                </div>
                                <div>
                                    <p class="text-slate-400 font-bold mb-1 uppercase tracking-wider">PELANGGAN</p>
                                    <p class="font-bold text-slate-800 text-base">${searchResult.voucher.customerName}</p>
                                    <p class="text-[10px] text-slate-500 mt-1 truncate">${searchResult.voucher.customerAddress}</p>
                                </div>
                            </div>
                            <button onclick="handleRedeemVoucher()" class="w-full mt-2 py-3 bg-emerald-600 hover:bg-emerald-550 text-white rounded-xl font-bold shadow-lg shadow-emerald-600/10 hover:shadow-emerald-650/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                                <i data-lucide="check" class="w-4 h-4"></i> Konfirmasi Penggunaan Voucer (Potongan 100K)
                            </button>
                        </div>
                    </div>`;
                }
            }

            const usedVouchers = vouchers.filter(v => v.status === 'used').reverse();
            let historyHTML = '';
            if (usedVouchers.length === 0) {
                historyHTML = `<div class="p-8 text-center text-slate-450 bg-white">Belum ada voucer yang diklaim kasir hari ini.</div>`;
            } else {
                const rows = usedVouchers.map(v => `
                    <tr class="hover:bg-slate-50/80 border-b border-slate-150 transition-colors text-slate-700">
                        <td class="p-4 text-slate-500 font-semibold text-xs">
                            ${new Date(v.usedAt).toLocaleString('id-ID', {hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'})}
                        </td>
                        <td class="p-4 font-mono font-bold text-indigo-600 text-xs">${v.code}</td>
                        <td class="p-4 font-bold text-slate-800 text-sm">${v.customerName}</td>
                    </tr>
                `).join('');
                historyHTML = `
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                        <tr>
                            <th class="p-4 font-bold">Waktu Klaim</th>
                            <th class="p-4 font-bold">Kode</th>
                            <th class="p-4 font-bold">Pelanggan</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">${rows}</tbody>
                </table>`;
            }

            return `
            <div class="space-y-8 animate-fade-in">
                <!-- Scanner -->
                <div class="bg-white border border-slate-200 p-8 rounded-3xl shadow-xl max-w-2xl mx-auto relative overflow-hidden">
                    <div class="absolute -top-10 -right-10 w-24 h-24 bg-emerald-500/5 rounded-full blur-xl"></div>
                    <div class="text-center mb-8">
                        <div class="inline-block bg-emerald-50 p-3 rounded-2xl text-emerald-600 border border-emerald-100 mb-4">
                            <i data-lucide="shield-check" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Verifikasi Kode Voucer</h2>
                        <p class="text-xs text-slate-500 mt-1">Masukkan kode voucer fisik/pesan digital untuk klaim diskon belanja</p>
                    </div>

                    <form id="verify-form" class="relative max-w-md mx-auto">
                        <input type="text" id="search-code" placeholder="Cth: VCH-ABC123" class="w-full pl-12 pr-32 py-4 text-base font-mono rounded-2xl border-2 border-slate-200 bg-slate-50 focus:outline-none focus:border-emerald-500 uppercase font-bold text-slate-800 outline-none tracking-widest" />
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-6 h-6"></i>
                        <button type="submit" class="absolute right-2 top-2 bottom-2 bg-slate-900 hover:bg-slate-950 text-white px-6 rounded-xl font-bold text-sm transition-all active:scale-95 shadow-md">Verifikasi</button>
                    </form>

                    <div class="mt-8 pt-8 border-t border-slate-100 max-w-md mx-auto">
                        ${resultHTML}
                    </div>
                </div>

                <!-- Log History -->
                <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden max-w-4xl mx-auto shadow-xl">
                    <div class="p-6 border-b border-slate-200 bg-slate-50/50">
                        <h3 class="font-bold text-slate-900 text-base">Riwayat Voucer yang Diklaim</h3>
                    </div>
                    <div class="overflow-x-auto">${historyHTML}</div>
                </div>
            </div>`;
        }

        // ==========================================
        // INISIALISASI & PENGIKATAN EVENT LISTENER
        // ==========================================
        function attachEventListeners() {
            // Form Login
            const loginForm = document.getElementById('login-form');
            if (loginForm) loginForm.addEventListener('submit', handleLogin);

            // Form Pembuatan Voucer
            const createVoucherForm = document.getElementById('create-voucher-form');
            if (createVoucherForm) createVoucherForm.addEventListener('submit', handleCreateVoucher);

            // Form Verifikasi Admin
            const verifyForm = document.getElementById('verify-form');
            if (verifyForm) verifyForm.addEventListener('submit', handleSearchVoucher);

            // Form Pembuatan Akun
            const createUserForm = document.getElementById('create-user-form');
            if (createUserForm) createUserForm.addEventListener('submit', handleCreateUser);

            // Form Edit Akun
            const editUserForm = document.getElementById('edit-user-form');
            if (editUserForm) editUserForm.addEventListener('submit', handleEditUserSubmit);

            // Form Tambah Penjualan
            const createSaleForm = document.getElementById('create-sale-form');
            if (createSaleForm) createSaleForm.addEventListener('submit', handleCreateSale);

            // Form Edit Penjualan
            const editSaleForm = document.getElementById('edit-sale-form');
            if (editSaleForm) editSaleForm.addEventListener('submit', handleEditSaleSubmit);
        }

        // Jalankan saat halaman pertama kali dimuat
        document.addEventListener('DOMContentLoaded', () => {
            reRender();
        });

    </script>
</body>
</html>
