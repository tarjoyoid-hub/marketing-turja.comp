<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistem Manajemen Voucer - Turja Computer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        *, ::before, ::after {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }
        .font-mono, .voucher-code-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .bg-dots {
            background-image: radial-gradient(rgba(99, 102, 241, 0.05) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 bg-dots text-slate-800 flex flex-col justify-between">

    <!-- Container Utama -->
    <div id="app" class="w-full flex-grow"></div>

    <!-- Container Toast Notification Custom -->
    <div id="toast-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none"></div>

    <!-- Custom Modal Confirm Container -->
    <div id="confirm-modal-container" class="fixed inset-0 bg-slate-900/45 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-all duration-300">
        <div class="bg-white border border-slate-100 rounded-3xl p-6 max-w-sm w-full shadow-2xl animate-fade-in text-center">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-200">
                <i data-lucide="help-circle" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-2 font-mono" id="modal-title">Konfirmasi Tindakan</h3>
            <p class="text-slate-500 text-sm mb-6 leading-relaxed" id="modal-desc">Apakah Anda yakin ingin melanjutkan tindakan ini?</p>
            <div class="flex gap-3 font-mono">
                <button id="modal-cancel-btn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition-all">Batal</button>
                <button id="modal-confirm-btn" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-indigo-600/30">Ya, Setuju</button>
            </div>
        </div>
    </div>

    <script>
        const defaultUsers = [
            { id: '1', username: 'Admin', password: '123', role: 'admin', name: 'Administrator Utama' }
        ];

        let users = JSON.parse(localStorage.getItem('tc_users')) || defaultUsers;
        const oldAdminIdx = users.findIndex(u => u.role === 'admin' && u.username === 'admin' && u.password === 'password123');
        if (oldAdminIdx > -1) {
            users[oldAdminIdx].username = 'Admin';
            users[oldAdminIdx].password = '123';
            localStorage.setItem('tc_users', JSON.stringify(users));
        }

        let vouchers = JSON.parse(localStorage.getItem('tc_vouchers')) || [];
        let sales = JSON.parse(localStorage.getItem('tc_sales')) || [];
        let currentUser = JSON.parse(localStorage.getItem('tc_currentUser')) || null;

        let activeAdminTab = 'verify';
        let activeMarketingTab = 'create_voucher';
        let generatedVoucher = null;
        let searchResult = null;
        let loginError = '';
        let editingUserId = null;
        let editingSaleId = null;
        let isDrawerOpen = false;

        function saveData() {
            localStorage.setItem('tc_users', JSON.stringify(users));
            localStorage.setItem('tc_vouchers', JSON.stringify(vouchers));
            localStorage.setItem('tc_sales', JSON.stringify(sales));
            localStorage.setItem('tc_currentUser', JSON.stringify(currentUser));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            container.innerHTML = '';
            const toast = document.createElement('div');
            toast.className = `p-6 rounded-3xl flex flex-col items-center text-center gap-4 shadow-2xl border border-slate-200 bg-white text-sm pointer-events-auto transition-all duration-300 transform scale-95 opacity-0 animate-fade-in max-w-sm w-full`;
            let icon = 'check-circle', iconColor = 'text-emerald-500', borderColor = 'border-emerald-500/20', bgIcon = 'bg-emerald-500/10';
            if (type === 'error') {
                icon = 'x-circle'; iconColor = 'text-red-500'; borderColor = 'border-red-500/20'; bgIcon = 'bg-red-500/10';
            } else if (type === 'warning') {
                icon = 'alert-triangle'; iconColor = 'text-amber-500'; borderColor = 'border-amber-500/20'; bgIcon = 'bg-amber-500/10';
            }
            toast.innerHTML = `
                <div class="w-16 h-16 ${bgIcon} ${iconColor} rounded-full flex items-center justify-center border ${borderColor}">
                    <i data-lucide="${icon}" class="w-8 h-8"></i>
                </div>
                <div class="text-slate-800 font-semibold text-base leading-relaxed">${message}</div>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.classList.remove('scale-95', 'opacity-0');
                toast.classList.add('scale-100', 'opacity-100');
            }, 10);
            setTimeout(() => {
                toast.classList.remove('scale-100', 'opacity-100');
                toast.classList.add('scale-95', 'opacity-0');
                setTimeout(() => { toast.remove(); }, 300);
            }, 2500);
        }

        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'VCH-';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function handleCreateVoucher(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const desa = document.getElementById('cust-desa').value.trim();
            const kec = document.getElementById('cust-kec').value.trim();
            if (!name || !desa || !kec) return;

            const fullAddress = `Desa ${desa}, Kec. ${kec}`;
            const now = new Date();
            const expiryDate = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

            const newVoucher = {
                id: Date.now().toString(),
                code: generateRandomCode(),
                customerName: name,
                customerPhone: phone,
                customerAddress: fullAddress,
                status: 'active',
                createdBy: currentUser.name,
                createdAt: now.toISOString(),
                expiresAt: expiryDate.toISOString(),
                usedAt: null
            };

            vouchers.unshift(newVoucher);
            generatedVoucher = newVoucher;
            saveData();
            showToast('Voucer baru senilai 100 Rb berhasil diterbitkan!', 'success');
            reRender();

            // Kirim data ke Google Sheets melalui Apps Script Web App
            fetch('https://script.google.com/macros/s/AKfycbyn5nyDOHxgea3R3S6kXX_zxyVftK-E4I3z3u56OknjyGVdXg1ctOsdRmet4MPH5tOA/exec', { 
                method: 'POST',
                body: JSON.stringify({
                    code: newVoucher.code,
                    customerName: newVoucher.customerName,
                    customerPhone: newVoucher.customerPhone,
                    customerAddress: newVoucher.customerAddress,
                    status: newVoucher.status,
                    createdBy: newVoucher.createdBy,
                    createdAt: newVoucher.createdAt
                }),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === "success") {
                    showToast('Data voucer tersimpan di Google Sheets!', 'success');
                } else {
                    showToast('Gagal menyimpan data ke Google Sheets', 'error');
                }
            })
            .catch(() => {
                showToast('Gagal terkoneksi ke Google Sheets', 'error');
            });
        }

        // (Untuk singkat saya hapus fungsi lain, tetap pakai fungsi yang sudah ada di source Anda)

        // Dummy reRender untuk demo (gunakan original fungsi reRender yang Anda punya)
        function reRender() {
            const app = document.getElementById('app');
            if(!currentUser){
                app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center p-4">
                    <form id="login-form" class="space-y-5">
                        <input id="username" placeholder="Username" class="border p-3 rounded w-64" required />
                        <input id="password" type="password" placeholder="Password" class="border p-3 rounded w-64" required />
                        <button type="submit" class="bg-red-600 text-white py-3 px-10 rounded">Login</button>
                    </form>
                    <div class="text-red-600 mt-4">${loginError}</div>
                </div>`;
                const loginForm = document.getElementById('login-form');
                loginForm.addEventListener('submit', e => {
                    e.preventDefault();
                    const u = document.getElementById('username').value.trim();
                    const p = document.getElementById('password').value;
                    const user = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
                    if(user){
                        currentUser = user;
                        loginError = '';
                        saveData();
                        reRender();
                        showToast(`Selamat datang kembali, ${user.name}!`);
                    } else {
                        loginError = 'Username atau password salah.';
                        reRender();
                    }
                });
            } else {
                app.innerHTML = `
                <main class="max-w-7xl mx-auto p-6">
                    <h1 class="text-2xl font-bold mb-4">Buat Voucher Diskon</h1>
                    <form id="create-voucher-form" class="space-y-4 max-w-md">
                        <div>
                            <label>Nama Pelanggan *</label>
                            <input id="cust-name" type="text" required class="border p-3 rounded w-full" placeholder="Cth: Budi Santoso" />
                        </div>
                        <div>
                            <label>No. WhatsApp Pelanggan *</label>
                            <input id="cust-phone" type="tel" required class="border p-3 rounded w-full" placeholder="Cth: 08123456789" />
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label>Desa *</label>
                                <input id="cust-desa" type="text" required class="border p-3 rounded w-full" placeholder="Cth: Sukamaju" />
                            </div>
                            <div>
                                <label>Kecamatan *</label>
                                <input id="cust-kec" type="text" required class="border p-3 rounded w-full" placeholder="Cth: Jati" />
                            </div>
                        </div>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded font-bold w-full">Generate Cyber Pass</button>
                    </form>

                    <div class="mt-8">
                        <h2 class="text-xl font-semibold mb-3">Voucher Terbaru</h2>
                        <pre class="bg-gray-100 p-4 rounded font-mono">${generatedVoucher ? JSON.stringify(generatedVoucher, null, 2) : 'Belum ada voucher yang dibuat.'}</pre>
                    </div>

                    <button class="mt-6 bg-red-600 text-white px-6 py-3 rounded" onclick="handleLogout()">Keluar</button>
                </main>`;
                document.getElementById('create-voucher-form').addEventListener('submit', handleCreateVoucher);
            }
            lucide.createIcons();
        }

        function handleLogout() {
            currentUser = null;
            generatedVoucher = null;
            searchResult = null;
            saveData();
            reRender();
            showToast('Anda telah keluar dari sistem.');
        }

        document.addEventListener('DOMContentLoaded', reRender);

    </script>
</body>
</html>
