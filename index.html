<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistem Manajemen Voucer - Turja Computer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Animasi sederhana */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">

    <!-- Container Utama -->
    <div id="app"></div>

    <script>
// Ganti URL ini dengan URL Web App Google Apps Script milikmu
const GOOGLE_SHEETS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwxoRhzvCUuFMXpO-wh3v-rCc-wpcgXplpJ7WHapJ04JWHq31vTJpMpuHEVXESk1Og2/exec';

function handleCreateVoucher(e) {
    e.preventDefault();
    const name = document.getElementById('cust-name').value;
    const phone = document.getElementById('cust-phone').value;
    const address = document.getElementById('cust-address').value;

    if (!name.trim()) return;

    const now = new Date();
    const expiryDate = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000); // +7 hari

    const newVoucher = {
        type: 'voucher', // tanda untuk Google Apps Script
        id: Date.now().toString(),
        code: generateRandomCode(),
        customerName: name,
        customerPhone: phone,
        customerAddress: address,
        status: 'active',
        createdBy: currentUser.name,
        createdAt: now.toISOString(),
        expiresAt: expiryDate.toISOString(),
        usedAt: null
    };

    vouchers.unshift(newVoucher);
    generatedVoucher = newVoucher;
    saveData();
    reRender();

    // Kirim data ke Google Sheets
    fetch(GOOGLE_SHEETS_WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify(newVoucher),
        headers: {'Content-Type': 'application/json'}
    }).then(res => res.json())
      .then(data => console.log('Voucher berhasil dikirim:', data))
      .catch(err => console.error('Gagal kirim voucer:', err));
}


function handleCreateUser(e) {
    e.preventDefault();
    const newName = document.getElementById('new-name').value;
    const newUsername = document.getElementById('new-username').value;
    const newPassword = document.getElementById('new-password').value;

    if (users.find(u => u.username === newUsername)) {
        alert("Username sudah digunakan. Pilih username lain.");
        return;
    }

    const newUser = {
        type: 'user', // tanda untuk Google Apps Script
        id: Date.now().toString(),
        username: newUsername,
        password: newPassword,
        role: 'marketing',
        name: newName
    };

    users.push(newUser);
    saveData();
    alert(`Akun marketing "${newName}" berhasil dibuat!`);
    reRender();

    // Kirim data user ke Google Sheets
    fetch(GOOGLE_SHEETS_WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify(newUser),
        headers: {'Content-Type': 'application/json'}
    }).then(res => res.json())
      .then(data => console.log('User berhasil dikirim:', data))
      .catch(err => console.error('Gagal kirim user:', err));
}

        // ==========================================
        // FUNGSI AKSI (LOGIC)
        // ==========================================
        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            
            const user = users.find(u => u.username === usernameInput && u.password === passwordInput);
            if (user) {
                currentUser = user;
                loginError = '';
                saveData();
                reRender();
            } else {
                loginError = 'Username atau password salah.';
                reRender();
            }
        }

        function handleLogout() {
            currentUser = null;
            generatedVoucher = null;
            searchResult = null;
            saveData();
            reRender();
        }

        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'VCH-';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function handleCreateVoucher(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            if (!name.trim()) return;

            const now = new Date();
            const expiryDate = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000); // +7 Hari

            const newVoucher = {
                type: 'voucher', // tanda untuk Google Apps Script
                id: Date.now().toString(),
                code: generateRandomCode(),
                customerName: name,
                customerPhone: phone,
                customerAddress: address,
                status: 'active',
                createdBy: currentUser.name,
                createdAt: now.toISOString(),
                expiresAt: expiryDate.toISOString(),
                usedAt: null
            };

            vouchers.unshift(newVoucher); // Tambah di awal array
            generatedVoucher = newVoucher;
            saveData();
            reRender();

            // Kirim data ke Google Sheets via Web Apps
            fetch(GOOGLE_SHEETS_WEBAPP_URL, {
                method: 'POST',
                body: JSON.stringify(newVoucher),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                console.log('Kirim voucer ke Google Sheets:', data);
            })
            .catch(err => {
                console.error('Gagal kirim voucer ke Google Sheets:', err);
            });
        }

        function handleSearchVoucher(e) {
            e.preventDefault();
            const code = document.getElementById('search-code').value.toUpperCase().trim();
            if (!code) return;

            const voucher = vouchers.find(v => v.code === code);
            
            if (!voucher) {
                searchResult = { status: 'not_found', voucher: null };
            } else {
                const isExpired = new Date(voucher.expiresAt) < new Date();
                if (voucher.status === 'used') {
                    searchResult = { status: 'used', voucher: voucher };
                } else if (isExpired) {
                    searchResult = { status: 'expired', voucher: voucher };
                } else {
                    searchResult = { status: 'found', voucher: voucher };
                }
            }
            reRender();
        }

        function handleRedeemVoucher() {
            if (searchResult?.status !== 'found') return;

            const confirmRedeem = window.confirm(`Verifikasi bahwa pelanggan adalah ${searchResult.voucher.customerName}?`);
            if (!confirmRedeem) return;

            const voucherIndex = vouchers.findIndex(v => v.id === searchResult.voucher.id);
            if(voucherIndex > -1) {
                vouchers[voucherIndex].status = 'used';
                vouchers[voucherIndex].usedAt = new Date().toISOString();
                
                searchResult = { 
                    status: 'used', 
                    voucher: vouchers[voucherIndex] 
                };
                saveData();
                reRender();
            }
        }

        function handleCreateUser(e) {
            e.preventDefault();
            const newName = document.getElementById('new-name').value;
            const newUsername = document.getElementById('new-username').value;
            const newPassword = document.getElementById('new-password').value;

            if (users.find(u => u.username === newUsername)) {
                alert("Username sudah digunakan. Pilih username lain.");
                return;
            }
            
            const newUser = {
                type: 'user', // tanda untuk Google Apps Script
                id: Date.now().toString(),
                username: newUsername,
                password: newPassword,
                role: 'marketing',
                name: newName
            };
            
            users.push(newUser);
            saveData();
            alert(`Akun marketing "${newName}" berhasil dibuat!`);
            reRender();

            // Kirim data user ke Google Sheets via Web Apps
            fetch(GOOGLE_SHEETS_WEBAPP_URL, {
                method: 'POST',
                body: JSON.stringify(newUser),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                console.log('Kirim user baru ke Google Sheets:', data);
            })
            .catch(err => {
                console.error('Gagal kirim user ke Google Sheets:', err);
            });
        }

        // (Sisa kode tetap sama...)

        // ... seluruh sisa script tanpa perubahan untuk render dan event listener ...

        // INISIALISASI & PENGIKATAN EVENT LISTENER
        function attachEventListeners() {
            // Form Login
            const loginForm = document.getElementById('login-form');
            if (loginForm) loginForm.addEventListener('submit', handleLogin);

            // Form Pembuatan Voucer
            const createVoucherForm = document.getElementById('create-voucher-form');
            if (createVoucherForm) createVoucherForm.addEventListener('submit', handleCreateVoucher);

            // Form Verifikasi Admin
            const verifyForm = document.getElementById('verify-form');
            if (verifyForm) verifyForm.addEventListener('submit', handleSearchVoucher);

            // Form Pembuatan Akun
            const createUserForm = document.getElementById('create-user-form');
            if (createUserForm) createUserForm.addEventListener('submit', handleCreateUser);
        }

        document.addEventListener('DOMContentLoaded', () => {
            reRender();
        });
    </script>
</body>
</html>
